# AgentDojo leakage experiment (mock mode — no AgentDojo install required).
# To use real AgentDojo: set agentdojo_mock_mode: false and install AgentDojo per official docs.
experiment_name: agentdojo_leakage
system_name: agentdojo
goal: leakage
num_iterations: 5
num_tasks: 5
attack_generator: auto_research
defense: no_defense
scoring_weights:
  total_exposure_rate: 1.0
  internal_leakage_rate: 0.5
  final_output_leakage_rate: 0.5
  utility_drop: -0.2
output_dir: results
random_seed: 42
adapter_type: agentdojo
adapter_config:
  agentdojo_mock_mode: true
  suite_name: default
